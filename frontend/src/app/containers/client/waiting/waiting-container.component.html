<div class="waiting-room">
    <h2 class="page-title">Bijna klaar voor de volgende ronde</h2>

    <div class="stack">
        <div class="photo">
            <img [src]="gifUrl$ | async" alt="" [class.invisible]="gifLoading" (load)="onGifLoad()">
            <img [class.invisible]="!gifLoading" src="/api/frontend-assets/images/tv-static.gif" alt=""
                aria-hidden="true">
        </div>
        <img class="frame" src="/api/frontend-assets/images/television.png" alt="" aria-hidden="true">
        <button type="button" class="piece" [class.wiggle]="!interacted" [class.cooling]="cooling" [class.stuck]="stuck"
            aria-label="Draai" [attr.aria-disabled]="cooling" (click)="onNewGif()"
            (animationend)="onAnimationEnd($event)">
            <img src="api/frontend-assets/images/tv-button.png" alt="" aria-hidden="true"
                [style.--rot]="rotation + 'deg'">
        </button>
    </div>
</div>
