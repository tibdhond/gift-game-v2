<div class="container">
    <h2>Breng je stem uit voor het huidige cadeau</h2>
    <div class="player-container" *ngIf="players$ | async as players">
        <ng-container *ngFor="let player of players">
            <div class="card card-shadow card-marg" 
                 [class.tile-card]="player.avatarPath" 
                 [class.game-card]="!player.avatarPath"
                 [class.self-vote-highlight]="userId === player.id"
                 [class.processing]="isProcessing"
                 (click)="onVote(player.id)">
                <div class="card-body text-center">
                    <app-player-image [avatarPath]="player.avatarPath"></app-player-image>
                    <h5 class="card-title">{{player.name}}</h5>
                    <span *ngIf="userId === player.id" class="badge-gold">JOUW CADEAU</span>
                </div>
            </div>
        </ng-container>
    </div>
</div>
