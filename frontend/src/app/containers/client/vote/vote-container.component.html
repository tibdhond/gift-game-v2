<div class="container">
    <h2>Breng je stem uit voor het huidige cadeau</h2>
    <div class="player-container" *ngIf="players$ | async as players">
        <ng-container *ngFor="let player of players">
            <app-player-tile [avatarPath]="player.avatarPath" [badge]="userId === player.id"
                [badgeMessage]="'MIJN CADEAU'" [highlight]="userId === player.id" [isProcessing]="isProcessing" [name]="player.name"
                (onTileClicked)="onVote(player.id)"></app-player-tile>
        </ng-container>
    </div>
</div>
