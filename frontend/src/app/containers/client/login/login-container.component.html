<div class="centered-page">
    <app-tag-card class="login-card">
        <h2 class="page-title card-title">Login</h2>

        <label class="field-label" for="loginName">Naam</label>
        <div class="input-row">
            <input type="text" id="loginName" class="game-input" required autocomplete="nickname" enterkeyhint="go"
                [formControl]="loginControl" (keyup.enter)="onLogin()" />
            <button type="button" class="action-button round" aria-label="Inloggen" (click)="onLogin()">
                <mat-icon fontIcon="send" aria-hidden="true"></mat-icon>
            </button>
        </div>
    </app-tag-card>
</div>
