<div class="lobby">
    <section class="join-panel">
        <div class="join-info">
            <h2 class="page-title">Doe mee!</h2>

            <ng-container *ngIf="host$ | async as host">
                <p class="lead">Ga naar</p>
                <p class="host-url">{{ host }}</p>
            </ng-container>

            <p class="lead">en geef deze code in</p>
            <div class="code-plate" *ngIf="codeChars$ | async as chars">
                <span class="code-char" *ngFor="let char of chars">{{ char }}</span>
            </div>
        </div>

        <div class="qr-wrap" *ngIf="qrUrl$ | async as url">
            <app-styled-qr [data]="url" [size]="260"></app-styled-qr>
            <p class="lead">of scan de QR-code</p>
        </div>
    </section>

    <section class="players" *ngIf="{ list: players$ | async } as p">
        <div class="players-bar">
            <h3 class="section-title" *ngIf="p.list?.length">
                Spelers <span class="count">{{ (p.list)?.length }}</span>
            </h3>
            <button type="button" class="action-button" (click)="onRoundStart()">
                <mat-icon fontIcon="play_arrow" aria-hidden="true"></mat-icon>
                Spel starten
            </button>
        </div>

        <div class="player-container" *ngIf="p.list?.length; else emptyPlayers">
            <app-player-tile class="joined" *ngFor="let player of p.list; trackBy: trackPlayer"
                [avatarPath]="player.avatarPath" [name]="player.name" [deleteIcon]="true"
                (onDeleteClicked)="onDeletePlayer(player.id)"></app-player-tile>
        </div>

        <ng-template #emptyPlayers>
            <p class="waiting">
                Wachten op spelers
                <span class="dot" aria-hidden="true"></span><span class="dot" aria-hidden="true"></span><span
                    class="dot" aria-hidden="true"></span>
            </p>
        </ng-template>
    </section>
</div>
