<div class="container">
    <ng-container *ngIf="host$ | async as host">
        <h3 style="margin-bottom: 1rem;">Ga naar {{host}} en geef code <span class="accent">{{gameId$ | async}}</span>
            in om te
            beginnen
        </h3>
    </ng-container>
    <ng-container *ngIf="qrUrl$ | async as url">
        <qrcode [qrdata]="url" [width]="225" [errorCorrectionLevel]="'M'" colorLight="#364E43" elementType="svg">
        </qrcode>
    </ng-container>
    <div style="margin-top: 1rem;">
        <ng-container *ngIf="players$ | async as players; else emptyPlayers">
            <h4>{{players.length}} geregistreerde speler{{players.length > 1 ? 's' : ''}}</h4>
            <div class="player-container">
                <ng-container *ngFor="let player of players">
                    <div class="card card-shadow.card-marg game-card player-card">
                        <div>
                            <button class="remove-btn" type="submit" name="person" (click)="onDeletePlayer(player.id)">
                                <mat-icon class="delete-icon" aria-hidden="false" aria-label="delete"
                                    fontIcon="delete"></mat-icon>
                            </button>
                        </div>
                        <div class="card-body text-center">
                            <mat-icon class="player-icon" aria-hidden="false" aria-label="player"
                                fontIcon="person"></mat-icon>
                            <h5 class="card-title player-name">{{player.name}}</h5>
                        </div>
                    </div>
                </ng-container>
            </div>
        </ng-container>
        <ng-template #emptyPlayers>
            <p>Er zijn nog geen spelers</p>
        </ng-template>
    </div>
    <button class="btn game-button start-button" type="submit" (click)="onRoundStart()">Spel
        starten</button>
</div>
