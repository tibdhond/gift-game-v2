<div class="stage" *ngIf="{ layout: layout$ | async } as v" [style.--ch]="v.layout?.horizontal ?? 4"
    [style.--cv]="v.layout?.vertical ?? 3" [style.--fit]="fit">

    <ng-container *ngIf="(gift$ | async) as gift; else noGift">

        <!-- Signposts: one grid per edge; players who haven't voted stay faded against the edge -->
        <ng-container *ngIf="v.layout as layout">
            <div class="edge" *ngFor="let edge of layout.edges; trackBy: trackEdge" [ngClass]="edge.name"
                [style.--cells]="edge.cells">

                <!-- trackBy keeps the same element per player, which is what lets the pop-out animate -->
                <div class="slot" *ngFor="let slot of edge.slots; trackBy: trackSlot" role="img"
                    [attr.aria-label]="slot.player.name + ((slot.player.phase === 'WAITING') ? ' heeft gestemd' : ' moet nog stemmen')"
                    [class.voted]="(slot.player.phase === 'WAITING')" [style.grid-column]="slot.gridColumn"
                    [style.grid-row]="slot.gridRow" [style.--k]="slot.k" [style.--t]="slot.t"
                    [attr.data-post-id]="slot.player.id" [class.arrived]="arrivedVoted.has(slot.player.id)"
                    [style.--snow-s]="slot.snowSize" [style.--snow-v]="slot.snowShift"
                    [style.--sway-p]="slot.swayPeriod" [style.--sway-d]="slot.swayPhase">

                    <div class="post">
                        <div class="pole"></div>
                        <div class="board">
                            <div class="face" [ngClass]="'shape-' + slot.shape">
                                <app-player-image [avatarPath]="slot.player.avatarPath"
                                    [bordered]="true"></app-player-image>
                                <span class="name">{{ slot.player.name }}</span>
                            </div>
                            <div class="snow" aria-hidden="true"></div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

        <!-- The middle of the screen -->
        <ng-template #giftImage let-src>
            <figure class="gift-image">
                <img [src]="src" [alt]="gift">
            </figure>
        </ng-template>

        <div class="center" *ngIf="{ image: giftImagePath$ | async } as g" [class.has-image]="!!g.image">

            <div class="image-cell left" *ngIf="g.image">
                <ng-container *ngTemplateOutlet="giftImage; context: { $implicit: g.image }"></ng-container>
            </div>

            <div class="middle">
                <div class="headline" *ngIf="!(invalid$ | async); else invalidGift">
                    <p class="lead">Mensen zijn aan het stemmen voor</p>
                    <h2 class="page-title gift">{{ gift }}</h2>
                </div>

                <ng-template #invalidGift>
                    <div class="headline">
                        <p class="lead">Ongeldige ronde voor</p>
                        <h2 class="page-title gift">{{ gift }}</h2>
                        <p class="note">Het pakje werd niet toegekend of meerdere mensen kenden het pakje aan zichzelf
                            toe.</p>
                    </div>
                </ng-template>

                <div class="spacer">
                    <app-animated-eyes [posts]="(eyePosts$ | async) ?? []" [locate]="locateBoard"></app-animated-eyes>
                </div>

                <button type="button" class="action-button reset" (click)="onResetRound()">
                    <mat-icon fontIcon="restart_alt" aria-hidden="true"></mat-icon>
                    Ronde resetten
                </button>
            </div>

            <div class="image-cell right" *ngIf="g.image">
                <ng-container *ngTemplateOutlet="giftImage; context: { $implicit: g.image }"></ng-container>
            </div>
        </div>
    </ng-container>


    <ng-template #noGift>
        <div class="center">
            <app-tag-card class="description-card" accent="#d9a441">
                <p class="lead">Het pakje is nog niet geopend.</p>
            </app-tag-card>
        </div>
    </ng-template>
</div>
