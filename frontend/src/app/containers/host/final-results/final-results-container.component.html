<ng-container *ngIf="category$ | async as category">
    <h2 class="page-title">Finale uitslag</h2>

    <div class="category-tabs" role="group" aria-label="Prijs">
        <button *ngFor="let c of categories" class="tab" [class.selected]="c.field === category.field"
            [attr.aria-pressed]="c.field === category.field" (click)="onSetSortField(c.field)">
            <mat-icon [fontSet]="c.fontSet ?? ''" aria-hidden="true">{{c.icon}}</mat-icon>
            {{ c.title }}
        </button>
    </div>
    <p class="caption">{{ category.description }}</p>

    <ng-container *ngIf="slots$ | async as slots">
        <app-podium #podium [slots]="slots"></app-podium>

        <app-player-rest-list [entries]="(restEntries$ | async) ?? []" [delay]="podium.endDelay"></app-player-rest-list>
    </ng-container>
</ng-container>
