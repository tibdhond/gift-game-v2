<div class="tile-wrap" #wrap [class.selected]="selected">
    <div class="env-layer env-behind" aria-hidden="true">
        <div class="env-back"></div>
    </div>
    <div class="env-layer env-flap-layer" #flapLayer aria-hidden="true">
        <div class="env-flap" #flap></div>
    </div>

    <div class="card-slot" #slot>
        <div class="card card-shadow card-marg" #card [class.tile-card]="avatarPath" [class.game-card]="!avatarPath"
            [class.self-vote-highlight]="highlight" [class.processing]="isProcessing" [class.unclickable]="!clickable"
            role="button" [attr.aria-pressed]="selected" [style.background-image]="'url(' + avatarPath + ')'"
            (click)="onClick()">
            <ng-container *ngIf="!avatarPath">
                <app-player-image class="icon-avatar" [avatarPath]="avatarPath" [size]="75"></app-player-image>
            </ng-container>
            <div class="card-body content-bottom">
                <div [class.avatar-tile-content]="!!avatarPath" [class.icon-tile-content]="!avatarPath">
                    <h5 class="card-title">{{name}}</h5>
                    <p class="card-text">{{infoText}}</p>
                </div>
                <span *ngIf="badge" class="badge-gold">{{badgeMessage}}</span>
                <ng-container *ngIf="deleteIcon">
                    <button class="remove-btn" type="submit" name="person" (click)="onDeleteClick()">
                        <mat-icon class="delete-icon" aria-hidden="false" aria-label="delete"
                            fontIcon="delete"></mat-icon>
                    </button>
                </ng-container>
            </div>
        </div>
    </div>

    <div class="env-layer env-above" aria-hidden="true">
        <div class="env-front" #front></div>
    </div>
</div>
