<div class="banner-container">
  <div class="banner-content">
    <h1 class="game-title">{{ title }}</h1>
    <ng-container *ngIf="username$ | async as username">
      <div class="user-identity">
        <span class="username">{{ username }}</span>
        <div class="avatar-preview" (click)="triggerUpload()">
          <ng-container *ngIf="avatarAvailable; else noAvatar">
            <img [src]="avatarUrl$ | async" [alt]="'Avatar'" />
          </ng-container>
        </div>
      </div>
      <input #fileInput type="file" (change)="onFileSelected($event)" style="display: none"
        accept="image/*, .heic, .heif" />
    </ng-container>
  </div>
</div>

<ng-template #noAvatar>
  <mat-icon class="player-icon" aria-hidden="false" aria-label="player" fontIcon="person"></mat-icon>
</ng-template>
