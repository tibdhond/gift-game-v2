<ng-container *ngIf="{value: isHostArea$ | async} as isHost">
    <app-banner *ngIf="isHost.value !== null" [title]="'🎄 Gift game V2'"
        [isHost]="isHost.value"><app-qr-cord></app-qr-cord></app-banner>
</ng-container>
<div class="app-container">
    <app-background-overlay [type]="'FLOATING'"></app-background-overlay>
    <app-notifications></app-notifications>
    <router-outlet class="router"></router-outlet>
    <app-message-display></app-message-display>
</div>
